# qq-bot-scheduler 配置

# 要调度的 QQ 群（逗号分隔，不带 group: 前缀）
QQ_GROUPS="1045372529"

# ---- 高峰（DeepSeek 2 倍价，工作日 9-12 / 14-18）----
PEAK_WINDOWS="0900-1200,1400-1800"
PEAK_MIN_MS=3600000
PEAK_MAX_MS=7200000
PEAK_PROB=0.01

# ---- 闲时 ----
OFF_MIN_MS=180000
OFF_MAX_MS=900000
OFF_PROB=0.02

# ---- 夜间 ----
NIGHT_WINDOWS="2300-0800"
NIGHT_MIN_MS=3600000
NIGHT_MAX_MS=7200000
NIGHT_PROB=0.01

# ---- 上下文控制（省钱大头）----
# 本会话上下文超过这个 token 数就换会话
ROTATE_AT_CACHE_TOKENS=80000
# 会话最长存活小时
ROTATE_HOURS=8
# 两次换会话之间至少隔多少秒（防抖，必须 > 0）
ROTATE_COOLDOWN_SEC=1800

# 法定节假日 / 调休上班日
HOLIDAYS=/etc/qq-bot/holidays.txt
MAKEUP_WORKDAYS=/etc/qq-bot/workdays.txt
