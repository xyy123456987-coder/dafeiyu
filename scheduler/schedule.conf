# qq-bot-scheduler 配置

QQ_GROUPS="1045372529"

# ---- 上班摸鱼（DeepSeek 2 倍价，工作日 9-12 / 14-18）----
PEAK_WINDOWS="0900-1200,1400-1800"
PEAK_MIN_MS=3600000
PEAK_MAX_MS=7200000
PEAK_PROB=0.01

# ---- 午休（工作日 12-14：基本在睡，不怎么理人）----
LUNCH_WINDOWS="1200-1400"
LUNCH_MIN_MS=5400000
LUNCH_MAX_MS=10800000
LUNCH_PROB=0.005

# ---- 闲时（下班后 / 周末 / 节假日）----
OFF_MIN_MS=180000
OFF_MAX_MS=900000
OFF_PROB=0.03

# ---- 夜间 ----
NIGHT_WINDOWS="2300-0800"
NIGHT_MIN_MS=3600000
NIGHT_MAX_MS=7200000
NIGHT_PROB=0.01

# ---- 上下文控制（省钱大头）----
ROTATE_AT_CACHE_TOKENS=80000
ROTATE_HOURS=8
ROTATE_COOLDOWN_SEC=1800

# 法定节假日 / 调休上班日
HOLIDAYS=/etc/qq-bot/holidays.txt
MAKEUP_WORKDAYS=/etc/qq-bot/workdays.txt
