# qq-bot-scheduler 配置
# 时区固定 Asia/Shanghai（脚本内部 export TZ）

# 要调度的 QQ 群（逗号分隔，不带 group: 前缀）
GROUPS="1045372529"

# ---- 高峰（DeepSeek 2 倍价）----
# 工作日峰时窗口，逗号分隔 HHMM-HHMM
PEAK_WINDOWS="0900-1200,1400-1800"
# 摸鱼节奏：1~2 小时才看一次
PEAK_MIN_MS=3600000
PEAK_MAX_MS=7200000
PEAK_PROB=0.01

# ---- 闲时 ----
# 1~10 分钟随机
OFF_MIN_MS=60000
OFF_MAX_MS=600000
OFF_PROB=0.05

# ---- 夜间（可注释掉 NIGHT_WINDOWS 以关闭）----
NIGHT_WINDOWS="2300-0800"
NIGHT_MIN_MS=1800000
NIGHT_MAX_MS=5400000
NIGHT_PROB=0.01

# 法定节假日（每行 YYYY-MM-DD）与调休上班日
HOLIDAYS=/etc/qq-bot/holidays.txt
MAKEUP_WORKDAYS=/etc/qq-bot/workdays.txt
